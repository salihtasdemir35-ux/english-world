name: Build English World APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Web dosyasını hazırla
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            SRC=$(find . -type f \( -iname "index.html" -o -iname "english-world.html" \) ! -path "./www/*" ! -path "./.git/*" | head -n 1)
            if [ -z "$SRC" ]; then
              echo "HATA: Uygulama dosyası bulunamadı. english-world.html dosyasını depoya yükleyin."
              exit 1
            fi
            echo "Kullanılan dosya: $SRC"
            cp "$SRC" www/index.html
          fi
          ls -la www

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Paketleri yükle
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Uygulama simgesi ve açılış ekranı
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Web dosyalarını ve eklentileri senkronize et
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EnglishWorld.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWorld-APK
          path: EnglishWorld.apk
