      ${[["🎈",1,"t1"],["🚀",2,"t2"],["🌟",3,"t3"],["🏆",4,"t4"]].map(([i,g,c])=>`<button class="gradebtn tile ${c}" data-g="${g}"><b>${i}</b>Grade ${g}<small>${g}. sınıf</small></button>`).join("")}</div></div>`;
    Voice.speak("Which grade are you in?");
    $$("[data-g]",m).forEach(b=>b.onclick=()=>{ S.grade=+b.dataset.g; onb.step=2; Sfx.play("click"); render(); });
  }else{
    m.innerHTML=`<div class="onb"><h1>Choose your character! ✨</h1><div class="grid g4" style="grid-template-columns:repeat(4,1fr)">
      ${AVATAR_BASES.map(b=>`<button class="shopitem ${S.avatar.base===b?"eq":""}" data-b="${b}" style="padding:16px"><b style="font-size:2.6em">${b}</b></button>`).join("")}</div>
      <div class="row" style="justify-content:center">${avatarHtml()}</div><button class="btn sun big" id="oGo">Let's go! 🚀</button></div>`;
    Voice.speak("Choose your character!");
    $$("[data-b]",m).forEach(b=>b.onclick=()=>{ S.avatar.base=b.dataset.b; Sfx.play("click"); render(); });
    $("#oGo").onclick=()=>{ S.onboarded=true; saveNow(); render(); startPlacement(); };
  }
}
/* Kısa seviye belirleme / ısınma oyunu → ardından ilk ders */
function startPlacement(){
  const u=unitsOf(S.grade)[0]; const prev=S.grade>1?unitsOf(S.grade-1):[];
  const pool=u.words.slice(0,8).concat(prev.flatMap(x=>x.words.slice(0,4)));
  const qs=pickN(pool,5).map((w,k)=>makeQ(k%2?"listen":"pic2word",w,pool)).filter(Boolean);
  Queue=[()=>startLesson(u.id)];
  runQuiz({title:"Isınma Oyunu", icon:"🔥", kind:"placement", questions:qs});
}

/* =========================================================
   16) SÜRE TAKİBİ + GÜNLÜK SINIR
   ========================================================= */
let lastInput=Date.now();
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{ lastInput=Date.now(); },{passive:true}));
setInterval(()=>{
  if(!S.onboarded || document.visibilityState!=="visible" || Date.now()-lastInput>90000) return;
  logToday().sec+=15; saveProgress();
  const lim=S.parent.limit; if(lim && logToday().sec/60>=lim && S.parent.override!==todayKey() && !modalOpen) showBreak();
},15000);
function showBreak(){
  Queue=[]; if(!$("#play").classList.contains("hidden")) closePlay();
  showModal(`<div class="reward">⏰</div><h1>Time for a break!</h1>${mascot("Great job today! See you tomorrow! 👋")}<p>Bugünkü İngilizce süren doldu. Gözlerini dinlendir, oyna, hareket et! 🌳</p>
    <details style="margin-top:12px"><summary>Ebeveyn</summary><input type="password" id="brP" inputmode="numeric" maxlength="4" placeholder="PIN" style="margin-top:8px"><button class="btn small" id="brOk" style="margin-top:8px">Bugün için süre ekle</button></details>`,
    {locked:true, onOpen:box=>{ $("#brOk",box).onclick=()=>{ if(S.parent.pin && $("#brP",box).value===S.parent.pin){ S.parent.override=todayKey(); saveNow(); closeModal(); } else toast("PIN hatalı"); }; }});
}

/* =========================================================
   17) BAŞLAT
   ========================================================= */
function init(){
  Voice.init(); ensureDaily(); ensureWeekly();
  if(S.lastActive && dayDiff(S.lastActive,todayKey())>1) S.streak=0;     // seri kırıldıysa sıfırla
  render();
  if(S.onboarded && S.parent.limit && logToday().sec/60>=S.parent.limit && S.parent.override!==todayKey()) showBreak();
  if(!Store.ok) toast("Not: Bu tarayıcı kalıcı kaydı engelliyor. Ebeveyn panelinden yedek alın.");
}
/* Android geri tuşu: modal → oyun → ana sayfa → çıkış */
function setupNative(){
  if(!isNative()) return; const A=window.Capacitor.Plugins && window.Capacitor.Plugins.App; if(!A) return;
  A.addListener("backButton",()=>{
    if(modalOpen){ if(!modalLocked) closeModal(); return; }
    if(!$("#play").classList.contains("hidden")){ Queue=[]; closePlay(); return; }
    if(!S.onboarded && onb.step>0){ onb.step--; render(); return; }
    if(S.onboarded && screen!=="home"){ go("home"); return; }
    saveNow(); A.exitApp();
  });
  A.addListener("pause",saveNow);
}
init(); setupNative();
</script>
